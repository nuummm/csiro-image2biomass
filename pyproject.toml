[project]
name = "csiro-image2biomass"
version = "0.1.0"
description = "Frozen-backbone embeddings + light heads for pasture biomass regression (Kaggle CSIRO Image2Biomass)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Kensei Nosaka" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "lightgbm>=4.7",
    "pillow>=10.3",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
embed = [
    "torch>=2.4",
    "timm>=1.0.20",
    "transformers>=4.46",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biomass"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["embed: needs the optional [embed] extra (torch, timm, transformers)"]
